name: Deploy Backend Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, dev, backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync backend source
        run: |
          sudo rm -rf /opt/cci/apps/dev/backend
          sudo mkdir -p /opt/cci/apps/dev/backend
          sudo rsync -av --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude "dist" \
            ./ /opt/cci/apps/dev/backend/
          sudo chown -R devops:devops /opt/cci/apps/dev/backend

      - name: Deploy backend
        run: |
          cd /opt/cci/compose
          docker compose -f docker-compose.dev.yml build backend-dev
          docker compose -f docker-compose.dev.yml up -d backend-dev

      - name: Cleanup docker
        run: |
          docker image prune -f
